map $http_upgrade $gpt_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name api-386gpt.truvis.co;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    access_log /var/www/vhosts/api-386gpt.truvis.co/logs/access.log;
    error_log /var/www/vhosts/api-386gpt.truvis.co/logs/error.log;

    location / {
        proxy_pass http://127.0.0.1:20386$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gpt_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    ssl_certificate /etc/letsencrypt/live/truvis.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truvis.co/privkey.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-386gpt.truvis.co;
    return 301 https://$host$request_uri;
}
